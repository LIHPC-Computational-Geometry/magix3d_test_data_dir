#=============================================================================
# parameter AERO file
#=============================================================================

[section_Dimension]
dim = 3
axisymetry = false

[section_INPUT_files]
input_mesh         = RAMCII_3D_0.01_0.3.vtk
input_surface_mesh = RAMCII_3D_Surface2.vtk
block_surface_3D   = 0

[section_OUTPUT_files]
output_file_name = AeroPipeline3D_Hexa.vtk
with_debug_files = false

[section_Physical]
Boundary_layer_thickness   = 0.05
Angle_of_Attack            = 0

[section_Cell_Size]
Number_of_Blocks_on_Wall = 1
Number_of_Cells_in_Boundary_layer = 10
Edge_Size_on_Wall = 0.06
Edge_Size_Default = 0.08
Edge_Size_First_Ortho_Wall = 0.002

[section_Extrusion]
Number_of_layers = 3
insertions_allowed = true
x_lim_insertions = -10000
y_lim_insertions = -10000
z_lim_insertions = -10000
insertions_allowed_on_first_layer = true
nbr_linear_blocks_smoothing = 1

[section_Curved_Blocks]
max_degree = 1
max_error = 0.1

[section_Vector_Field]
Vector_Field_Computation_Method = 1
x_lim_Vector_Field_Zone1 = 3.0
x_lim_Vector_Field_Zone2 = 10.0

[section_Smoothing]
Number_of_iterations_Yao = 0
Damping_Smoothing_Yao    = 0.2

[section_SU2_Writer]
x_lim_SU2_inoutlet = 0.000001
